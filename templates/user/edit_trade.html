{% extends "base_user.html" %}
{% block title %}Edit Trade - Tragene Journal{% endblock %}
{% block page_title %}Edit Trade #{{ trade.id }}{% endblock %}
{% block content %}

<div class="mb-3">
    <a href="{{ url_for('user.trade_detail', trade_id=trade.id) }}" class="text-decoration-none" style="color: var(--text-secondary);">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="card p-4">
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label small fw-bold">Symbol</label>
                <input type="text" name="symbol" class="form-control" value="{{ trade.symbol }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Type</label>
                <select name="trade_type" class="form-select">
                    <option value="buy" {% if trade.trade_type == 'buy' %}selected{% endif %}>BUY</option>
                    <option value="sell" {% if trade.trade_type == 'sell' %}selected{% endif %}>SELL</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Lot Size</label>
                <input type="number" name="lot_size" class="form-control" value="{{ trade.lot_size }}" step="0.01">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Entry Price</label>
                <input type="number" name="entry_price" class="form-control" value="{{ trade.entry_price }}" step="0.00001" required>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Exit Price</label>
                <input type="number" name="exit_price" class="form-control" value="{{ trade.exit_price if trade.exit_price else '' }}" step="0.00001">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Stop Loss</label>
                <input type="number" name="stop_loss" class="form-control" value="{{ trade.stop_loss if trade.stop_loss else '' }}" step="0.00001">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Take Profit</label>
                <input type="number" name="take_profit" class="form-control" value="{{ trade.take_profit if trade.take_profit else '' }}" step="0.00001">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Entry Date</label>
                <input type="datetime-local" name="entry_date" class="form-control" value="{{ trade.entry_date.strftime('%Y-%m-%dT%H:%M') }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Exit Date</label>
                <input type="datetime-local" name="exit_date" class="form-control" value="{{ trade.exit_date.strftime('%Y-%m-%dT%H:%M') if trade.exit_date else '' }}">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold">Session</label>
                <select name="session" class="form-select">
                    <option value="">Select</option>
                    <option value="asian" {% if trade.session == 'asian' %}selected{% endif %}>Asian</option>
                    <option value="london" {% if trade.session == 'london' %}selected{% endif %}>London</option>
                    <option value="newyork" {% if trade.session == 'newyork' %}selected{% endif %}>New York</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label small fw-bold">Tags</label>
                <input type="text" name="tags" class="form-control" value="{{ trade.tags if trade.tags else '' }}">
            </div>
            <div class="col-12">
                <label class="form-label small fw-bold">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ trade.notes if trade.notes else '' }}</textarea>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn text-white" style="background: var(--accent); border-radius: 8px; border: none;">
                <i class="bi bi-check-lg"></i> Save Changes
            </button>
            <a href="{{ url_for('user.trade_detail', trade_id=trade.id) }}" class="btn btn-outline-secondary" style="border-radius: 8px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
