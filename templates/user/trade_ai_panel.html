<!-- TRADE AI ANALYSIS PANEL -->
<!-- ═══════════════════════════════════════════════════════════ -->
<div class="trade-slide-panel" id="tradeAIPanel">
    <div class="slide-overlay" onclick="closeTradeAIPanel()"></div>
    <div class="slide-content">
        <div class="slide-header">
            <h6 id="aiPanelTitle">🤖 AI Analysis</h6>
            <button class="slide-close" onclick="closeTradeAIPanel()">&times;</button>
        </div>
        <div class="slide-body" style="display:flex;flex-direction:column;padding:0;">
            <!-- Trade Summary Bar -->
            <div id="aiTradeSummary" style="padding:12px 16px;border-bottom:1px solid var(--border-color);background:var(--bg-body);font-size:0.78rem;color:var(--text-secondary);">
            </div>
            
            <!-- Analysis + Chat Area -->
            <div id="aiChatArea" style="flex:1;overflow-y:auto;padding:16px;">
                <div class="text-center text-muted py-4" id="aiPlaceholder">
                    <i class="bi bi-robot" style="font-size:2rem;opacity:0.3;"></i>
                    <p class="mt-2" style="font-size:0.8rem;">Click "Analyze" to get AI insights on this trade</p>
                    <button class="btn-xs btn-xs-primary" onclick="analyzeTrade()">
                        <i class="bi bi-magic"></i> Analyze This Trade
                    </button>
                </div>
                <div id="aiMessages"></div>
            </div>
            
            <!-- Chat Input -->
            <div style="padding:12px;border-top:1px solid var(--border-color);display:flex;gap:8px;">
                <input type="text" id="aiChatInput" class="notes-textarea" placeholder="Ask about this trade..." 
                       style="min-height:38px;font-size:0.78rem;" onkeypress="if(event.key==='Enter')sendAIChat()">
                <button class="btn-xs btn-xs-primary" onclick="sendAIChat()" style="flex-shrink:0;">
                    <i class="bi bi-send"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentAITradeId = null;
    let chatHistory = [];

    function openTradeAI(tradeId, symbol) {
        currentAITradeId = tradeId;
        chatHistory = [];
        document.getElementById('tradeAIPanel').classList.add('show');
        document.getElementById('aiPanelTitle').textContent = `🤖 ${symbol} — Trade #${tradeId}`;
        document.getElementById('aiTradeSummary').textContent = 'Loading trade info...';
        document.getElementById('aiMessages').innerHTML = '';
        document.getElementById('aiPlaceholder').style.display = 'block';
        document.getElementById('aiChatInput').value = '';
        document.body.style.overflow = 'hidden';
        
        // Load trade summary
        fetch(`/user/api/trade/${tradeId}`)
            .then(res => res.json())
            .then(t => {
                const pnlSign = t.profit_loss > 0 ? '+' : '';
                document.getElementById('aiTradeSummary').innerHTML = `
                    <strong>${t.symbol}</strong> ${t.trade_type.toUpperCase()} | 
                    Entry: ${t.entry_price} | Exit: ${t.exit_price || 'Open'} | 
                    P&L: <span style="color:${t.profit_loss > 0 ? '#00e676' : '#ff5252'};">${pnlSign}$${Math.abs(t.profit_loss).toFixed(2)}</span> |
                    ${t.stop_loss ? '✅ SL' : '⚠️ No SL'} | 
                    ${t.is_win ? '🏆 WIN' : '❌ LOSS'}
                `;
            });
    }

    function closeTradeAIPanel() {
        document.getElementById('tradeAIPanel').classList.remove('show');
        document.body.style.overflow = '';
        currentAITradeId = null;
    }

    function analyzeTrade() {
        document.getElementById('aiPlaceholder').style.display = 'none';
        addAIMessage('system', 'Analyzing this trade...');
        
        fetch(`/user/api/trade/${currentAITradeId}/analyse`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(data => {
            // Remove loading message
            const loadingMsg = document.querySelector('.ai-msg-loading');
            if (loadingMsg) loadingMsg.remove();
            
            if (data.success) {
                addAIMessage('ai', data.analysis);
                chatHistory.push({ role: 'ai', content: data.analysis });
            } else {
                addAIMessage('ai', '❌ ' + data.message);
            }
        })
        .catch(() => {
            const loadingMsg = document.querySelector('.ai-msg-loading');
            if (loadingMsg) loadingMsg.remove();
            addAIMessage('ai', '❌ Analysis failed. Try again.');
        });
    }

    function sendAIChat() {
        const input = document.getElementById('aiChatInput');
        const question = input.value.trim();
        if (!question) return;
        
        input.value = '';
        addAIMessage('user', question);
        chatHistory.push({ role: 'user', content: question });
        
        // Show typing indicator
        const typingId = addAIMessage('system', 'Thinking...');
        
        fetch(`/user/api/trade/${currentAITradeId}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: question, history: chatHistory })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById(typingId)?.remove();
            if (data.success) {
                addAIMessage('ai', data.response);
                chatHistory.push({ role: 'ai', content: data.response });
            } else {
                addAIMessage('ai', '❌ ' + data.message);
            }
        })
        .catch(() => {
            document.getElementById(typingId)?.remove();
            addAIMessage('ai', '❌ Failed to get response.');
        });
        
        document.getElementById('aiChatArea').scrollTop = document.getElementById('aiChatArea').scrollHeight;
    }

    function addAIMessage(role, content) {
        const msgId = 'msg-' + Date.now();
        const container = document.getElementById('aiMessages');
        const div = document.createElement('div');
        div.id = msgId;
        div.style.cssText = `
            margin-bottom: 10px; padding: 10px 14px; border-radius: 12px;
            font-size: 0.78rem; line-height: 1.5; max-width: 90%;
            ${role === 'user' ? 'background:var(--accent);color:#fff;margin-left:auto;' : 
              role === 'ai' ? 'background:var(--bg-body);border:1px solid var(--border-color);color:var(--text-primary);' :
              'background:transparent;color:var(--text-muted);font-style:italic;text-align:center;'}
        `;
        div.textContent = content;
        if (role === 'system') div.className = 'ai-msg-loading';
        container.appendChild(div);
        document.getElementById('aiChatArea').scrollTop = document.getElementById('aiChatArea').scrollHeight;
        return msgId;
    }

    // ESC to close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeTradeAIPanel();
    });
</script>
